<ol class="etapas">
{% for nombre, clase, texto in etapas %}
  <li class="{{ clase }}">
    <span class="dot">{% if clase == 'done' %}<svg width="12" height="12" viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-6.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>{% endif %}</span>
    <span><span class="t">{{ nombre }}</span><span class="s">{{ texto }}</span></span>
  </li>
{% endfor %}
</ol>
