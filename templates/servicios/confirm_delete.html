{% extends "base.html" %}
{% block title %}Eliminar{% endblock %}
{% block content %}
<section class="card narrow">
  <h1>¿Eliminar la solicitud?</h1>
  <p>Vas a eliminar <strong>{{ object }}</strong> con sus documentos. Esta acción no se puede deshacer.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button class="btn" type="submit">Sí, eliminar</button>
    <a class="btn btn-secondary" href="{% url 'solicitud_detail' object.pk %}">Cancelar</a>
  </form>
</section>
{% endblock %}
